name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore
        run: dotnet restore Erp.slnx

      - name: Build
        run: dotnet build Erp.slnx -c Release --no-restore

      - name: Test
        run: dotnet test Erp.slnx -c Release --no-build --verbosity normal

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Check OpenAPI document is current
        run: |
          node scripts/export-openapi.mjs
          git diff --exit-code -- openapi/v1.json

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/erp-web
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: src/erp-web/package-lock.json

      - name: Install
        run: npm ci

      - name: Check generated API types
        run: |
          npm run gen:api
          git diff --exit-code -- src/api.generated.ts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  infra-synth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: infra/package-lock.json

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Synth
        run: npx cdk synth
